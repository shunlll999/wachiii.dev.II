  [['TOTAL TIME',fmt(finalTime)],['BEST LAP',fmt(best)],['PLACES GAINED',(gain>0?'+':'')+gain]].forEach(([a,b],i)=>{text(a,HALF-72,194+i*11,1,1);text(b,HALF+72,194+i*11,1,3,'r')});
  button(BT.again,'RACE AGAIN',true);button(BT.menu,'MAIN MENU',false)}
// ---------- world render (402x874) ----------
function project(wy,wz,camX,camY,camZ){const cz=wz-camZ,s=DEPTH/cz;return{x:SHALF-s*camX*SHALF,y:HZ-s*(wy-camY)*SHALF,w:s*ROADW*SHALF,s,cz}}
function sky(){
  for(let y=0;y<HZ;y++){const v=Math.pow(y/HZ,2.6)*.52,o=y*SW;for(let x=0;x<SW;x++)tp[o+x]=PAL[toneOf(v,x,y)]}
  for(const s of STARS){const x=wrap(s.x-bgOff*s.p,SW*2);if(x>=SW)continue;const tw=Math.sin(clock*3+s.b)>.85;px(x,s.y,tw?3:s.t);
    if(s.t===3&&tw){px(x-1,s.y,2);px(x+1,s.y,2);px(x,s.y-1,2);px(x,s.y+1,2)}}
  blit(PLANET,wrap(330-bgOff*.05,SW+PLANET.w)-PLANET.w*.75,24);
  blit(MOON,wrap(70-bgOff*.09,SW+60)-30,128);
  for(const c of CLOUDS)blit(c.s,wrap(c.x-bgOff*c.p,CLW)-c.s.w,c.y);
  const [far,mid,near]=MT;
  for(let x=0;x<SW;x++){
    let i=wrap(x+Math.floor(bgOff*far.p),ML),hh=Math.round(far.h[i]);
    for(let y=HZ-hh;y<HZ;y++)px(x,y,y-(HZ-hh)<2?2:(bay(x,y)<.4?2:1));
    i=wrap(x+Math.floor(bgOff*mid.p),ML);hh=Math.round(mid.h[i]);let sl=mid.h[i]>mid.h[wrap(i-1,ML)];
    for(let y=HZ-hh;y<HZ;y++){const d=y-(HZ-hh);px(x,y,d<1?2:sl?(bay(x,y)<.42?2:1):(bay(x,y)<.08?2:1))}
    i=wrap(x+Math.floor(bgOff*near.p),ML);hh=Math.round(near.h[i]);sl=near.h[i]>near.h[wrap(i-1,ML)];
    for(let y=HZ-hh;y<HZ;y++){const d=y-(HZ-hh);px(x,y,d<1?(sl?2:1):sl?(bay(x,y)<.35?1:0):(bay(x,y)<.06?1:0))}}
  for(let y=HZ-3;y<HZ;y++)rowL(0,SW,y,1,2,.35);
  for(let y=HZ;y<SH;y++)row(0,SW,y,0)}
function drawSegRows(s,p1,p2,maxy){
  const top=Math.max(0,Math.ceil(p2.y)),bot=Math.min(SH-1,Math.ceil(p1.y)-1,maxy-1),f=s.fog,dy=p1.y-p2.y,gl=s.c?.42:.28,pc=s.pad===null?-9:(s.pad+1)/2;
  for(let y=top;y<=bot;y++){const t=(y-p2.y)/dy,cx=p2.x+(p1.x-p2.x)*t,w=p2.w+(p1.w-p2.w)*t,o=y*SW,zr=s.i*64+Math.floor(t*64),iw=1/w;
    const lane=!s.c&&w>10,ck=s.i<3,lw=Math.max(.012,1.2*iw*.5),ew=Math.max(.025,1.2*iw*.5);
    for(let x=0;x<SW;x++){const a=(x-cx)*iw,aa=a<0?-a:a;let c;
      if(aa>1.32)c=bay(x,y)<gl?1:0;
      else if(aa>1.14)c=bay(x,y)<.5?2:1;
      else if(aa>1)c=aa>1.125?0:(s.c?3:0);
      else{const u=(a+1)*.5;c=1;
        if(u<ew||u>1-ew)c=3;
        else if(lane&&(Math.abs(u-1/3)<lw||Math.abs(u-2/3)<lw))c=3;
        else{if((Math.abs(u-.27)<.04||Math.abs(u-.73)<.04||Math.abs(u-.5)<.025)&&bay(x,y)<.3)c=0;
          const hs=hash(Math.floor(u*200),zr);if(hs<.02)c=2;else if(hs>.982)c=0}
        if(ck)c=((Math.floor(u*16)+s.i*2+(t<.5?0:1))&1)?3:0;
        const du=Math.abs(u-pc);if(du<.09)c=((t*2+du*7)%1)<.5?3:2}
      if(f>0&&bay(x+2,y+1)<f*.9)c=bay(x+1,y+3)<(f-.5)*1.4?2:1;
      tp[o+x]=PAL[c]}}

function barrier(s,side){const p1=s.p1,p2=s.p2,off=1.33*side,xa=p2.x+off*p2.w,xb=p1.x+off*p1.w,h1=p1.w*.17,h2=p2.w*.17,f1=p1.w*.62,f2=p2.w*.62;
  const x0=Math.max(0,Math.floor(Math.min(xa,xb))),x1=Math.min(SW-1,Math.ceil(Math.max(xa,xb))),post=s.i%4===0,fence=side<0,pw=Math.max(1,Math.round(p1.w*.012));
  for(let x=x0;x<=x1;x++){const t=Math.abs(xb-xa)<.5?1:clamp((x-xa)/(xb-xa),0,1),yb=p2.y+(p1.y-p2.y)*t,hh=h2+(h1-h2)*t,yt=yb-hh;
    const seam=Math.abs(x-xa)<1;
    for(let y=Math.max(0,Math.round(yt));y<Math.round(yb);y++){if(y>=s.clip)break;const d=(y-yt)/hh;px(x,y,d<.16?2:d>.84?0:seam?0:(s.c?3:1))}
    if(fence){const fh=f2+(f1-f2)*t,ft=Math.round(yt-fh);
      for(let y=Math.max(0,ft);y<Math.round(yt);y++){if(y>=s.clip)break;if(y===ft)px(x,y,2);else if(((x+y)&3)===0||(((x-y)%4)+4)%4===0)px(x,y,1)}
      if(post&&Math.abs(x-xb)<pw)for(let y=Math.max(0,ft);y<Math.round(yt);y++){if(y>=s.clip)break;px(x,y,2)}}}}
function pole(bxp,by,w,clip,side,lit){const pw=Math.max(1,Math.round(w*.025)),ph=Math.round(w*1.5),x0=Math.round(bxp-pw/2),yt=Math.round(by-ph);
  for(let y=yt;y<by;y++){if(y>=clip)break;if(pw<2)px(x0,y,2);else{row(x0,x0+Math.ceil(pw/2),y,2);row(x0+Math.ceil(pw/2),x0+pw,y,1)}}
  const al=Math.round(w*.3),dir=-side,ah=Math.max(1,Math.round(pw*.7));
  for(let k=0;k<al;k++)for(let j=0;j<ah;j++)if(yt+j<clip)px(x0+(dir>0?pw:-1)+dir*k,yt+j,2);
  const ls=Math.max(1,Math.round(w*.06)),lx=Math.round(x0+(dir>0?pw:-1)+dir*al-ls/2);

  if(lit&&ls>=4){for(let dy=0;dy<ls*2;dy++)for(let dx=-ls;dx<ls*2;dx++){const yy=yt+ah+(ls>>1)+dy;if(yy<clip&&bay(lx+dx,yy)<.18*(1-dy/(ls*2)))px(lx+dx,yy,2)}}}
function board(bxp,by,w,clip,txt){const pw=w*1.05,ph=w*.42,lh=w*.4,x0=Math.round(bxp-pw/2),y1=Math.round(by-lh),y0=Math.round(y1-ph),lw=Math.max(1,Math.round(w*.03)),b=Math.max(1,Math.round(w*.03));
  for(const l of [-.35,.35])rect(bxp+l*pw-lw/2,y1,lw,lh,1,clip);
  rect(x0,y0,pw,ph,0,clip);rect(x0+b,y0+b,pw-2*b,ph-2*b,2,clip);rect(x0+b,y0+b,pw-2*b,b,3,clip);
  const sc=Math.floor((pw-2*b-4)/(txt.length*4));if(sc>=1&&y1<clip&&5*sc<ph-2*b-2)text(txt,bxp,Math.round(y0+(ph-5*sc)/2),sc,0,'c')}
function arch(cx,by,w,clip,fin){const pw=Math.max(1,Math.round(w*.09)),ph=Math.round(w*1.05),bt=Math.max(1,Math.round(w*.15)),lx=Math.round(cx-w*1.45),rx=Math.round(cx+w*1.45),yt=Math.round(by-ph);
  for(let y=yt;y<by;y++){if(y>=clip)break;row(lx-pw,lx,y,2);row(rx,rx+pw,y,1);if(pw>2){px(lx-pw,y,3);px(rx+pw-1,y,0)}}
  const b=Math.max(1,Math.round(bt/2));
  for(let j=0;j<bt;j++){const y=yt+j;if(y>=clip)break;
    if(fin){for(let x=lx-pw;x<rx+pw;x++)px(x,y,(((Math.floor((x-lx)/b)+Math.floor(j/b))&1)?3:0))}
    else{row(lx-pw,rx+pw,y,j===0?2:1);if(j===bt>>1&&bt>2)for(let x=lx;x<rx;x+=Math.max(3,b*3))px(x,y,((x+frame>>3)&1)?3:2)}}
  if(yt+bt<clip)row(lx-pw,rx+pw,yt+bt,0);
  const sc=Math.floor(bt/7);if(sc>=1)text(fin?'VOID GP':'SECTOR',cx,yt-6*sc-2,sc,fin?3:2,'c',1)}
function crater(bxp,by,w,clip,k){const rx=w*k*.35,ry=rx*clamp((by-HZ)/700,.06,.42);if(rx<2||ry<1)return;
  for(let dy=-Math.ceil(ry);dy<=Math.ceil(ry);dy++){const y=Math.round(by+dy);if(y>=clip||y<0||y>=SH)continue;const sx=rx*Math.sqrt(Math.max(0,1-(dy/ry)**2));
    for(let x=Math.round(bxp-sx);x<=Math.round(bxp+sx);x++){const e=Math.hypot((x-bxp)/rx,dy/ry);px(x,y,e>.8?(dy<0?1:2):(dy<-ry*.1?(bay(x,y)<.45?1:0):0))}}}
function glow(x,y,r,big){const p=(frame>>1)&1;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const d=Math.hypot(dx,dy);
  if(d>r+.3)continue;const lv=1-d/(r+.5);const c=lv>.7?3:lv>.4?(bay(x+dx+p,y+dy)<.6?3:2):(bay(x+dx+p,y+dy)<lv*1.4?2:-1);if(c>=0)px(x+dx,y+dy,c)}
  if(big){for(const [ax,ay] of [[1,0],[-1,0],[0,1],[0,-1]])for(let k=r+1;k<r+4+((frame>>1)%4);k++)px(x+ax*k,y+ay*k,2)}}
function carShadow(cx,y,rx,clip){for(let yy=Math.round(y-Math.max(1,rx*.08));yy<=Math.round(y+Math.max(1,rx*.04));yy++){if(yy>=clip)break;for(let x=Math.round(cx-rx);x<=Math.round(cx+rx);x++)if((x+yy)&1)px(x,yy,0)}}
function blitSk(sp,x0,y0,skew,k=1,clip=SH){const dw=Math.round(sp.w*k),dh=Math.round(sp.h*k);if(dw<2||dh<2)return;
  for(let j=Math.max(0,-y0);j<dh;j++){const y=y0+j;if(y>=th||y>=clip)break;const sy=Math.min(sp.h-1,(j/k)|0),xo=Math.round(skew*k*(1-sy/sp.h));
    for(let i=Math.max(0,-x0-xo);i<dw&&x0+i+xo<tw;i++){const c=sp.d[sy*sp.w+Math.min(sp.w-1,(i/k)|0)];if(c>=0)tp[y*tw+x0+i+xo]=PAL[c]}}}
function drawCar(c,s){const t=(((c.dist%TL)+TL)%TL%SEG)/SEG,p1=s.p1,p2=s.p2,X=p1.x+(p2.x-p1.x)*t,Y=p1.y+(p2.y-p1.y)*t,w=p1.w+(p2.w-p1.w)*t,sc=p1.s+(p2.s-p1.s)*t,k=sc/scaleP;
  const sx=X+c.x*w;if(k<.04)return;
  const ps=pose(clamp(c.yaw+s.curve*.22,-1,1)),sp=CARS[c.liv][ps.view],x0=Math.round(sx-sp.ax*k),y0=Math.round(Y-sp.h*k);
  if(k>.15)carShadow(x0+sp.w*k/2,Y,sp.w*.5*k,s.clip);
  blitSk(sp,x0,y0,ps.skew,k,s.clip);
  if(k>.25)for(const e of sp.ex){const gy=Math.round(y0+e[1]*k);if(gy<s.clip)glow(Math.round(x0+e[0]*k+ps.skew*k*(1-e[1]/sp.h)),gy,Math.max(1,Math.round(3*k)),false)}}
function drawPlayer(){
  const bob=speed>MAX*.1?((frame>>2)&1):0,sx=shake>0?Math.round(Math.sin(frame*1.7)*2.5):0,run=state!=='title';
  const ps=pose(clamp(yaw,-1,1)),sp=CARS[0][ps.view],wP=ROADW*scaleP*SHALF,px0=SHALF+(playerX-camL)*wP+sx;
  const x0=Math.round(px0-sp.ax),y0=PY-sp.h-bob;

  if(run&&smokeT>0){smokeT=0;for(const o of [-62,62]){const wx=px0+o+(ps.view===0?-30:ps.view===2?30:0);
    parts.push({x:wx+(Math.random()-.5)*8,y:PY-4,vx:o*.4+(Math.random()-.5)*30-pvx*40,vy:20+Math.random()*50,l:.5,m:.5,sm:1})}}
  for(const e of sp.ex){const cx=x0+e[0]+Math.round(ps.skew*(1-e[1]/sp.h)),gy=y0+e[1];
    if(run)glow(cx,gy,boosting?8:3+((frame>>2)&1),boosting);
    if(run&&speed>MAX*.05){const n=boosting?5:1+(Math.random()<.6);
      for(let k=0;k<n;k++){const l=.2+Math.random()*(boosting?.4:.22);parts.push({x:cx+(Math.random()-.5)*4,y:gy+2,vx:(e[0]<sp.ax?-1:1)*(8+Math.random()*24)-pvx*30,vy:90+Math.random()*(boosting?220:110),l,m:l})}}}

    if(q.sm){const r=Math.round(3+(1-f)*9);for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r&&bay(Math.round(q.x+dx),Math.round(q.y+dy))<f*.55)px(q.x+dx,q.y+dy,f>.5?3:2);continue}
    const c=f>.6?3:f>.3?2:1;px(q.x,q.y,c);if(f>.45){px(q.x+1,q.y,c);px(q.x,q.y+1,c);px(q.x+1,q.y+1,f>.7?2:1)}}}
function speedLines(){const n=boosting?26:8;if(speed<MAX*.92&&!boosting)return;
  for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,r0=110+Math.random()*180,l=16+Math.random()*(boosting?80:36);
    for(let r=r0;r<r0+l;r+=1){const x=SHALF+Math.cos(a)*r*1.1,y=HZ+80+Math.sin(a)*r;if(y<68||y>760)continue;if(((r|0)&1)===0)px(x,y,r<r0+l*.6?2:1)}}}
function world(){
  sky();

  let maxy=SH,x=0,dx=-(base.curve*bp);
  for(let n=0;n<DRAW;n++){const s=segs[(base.i+n)%N],camZ=pos-(s.i<base.i?TL:0);
    s.p1=project(s.y1,s.i*SEG,camX-x,camY,camZ);s.p2=project(s.y2,(s.i+1)*SEG,camX-x-dx,camY,camZ);
    x+=dx;dx+=s.curve;s.clip=maxy;s.ok=s.p1.cz>DEPTH;s.fog=clamp((n-120)/(DRAW-120),0,1)*.92;
    if(!s.ok||s.p2.y>=s.p1.y||s.p2.y>=maxy)continue;

      for(const o of s.ord){if(o.t==='pine'){const k=p.s/scaleP*o.k*2.3;if(k>.02)drawSpr(PINES[o.v],p.x+o.o*p.w,p.y,k,s.clip)}

const fmt=t=>{const m=Math.floor(t/60),s=t%60;return m+':'+(s<10?'0':'')+s.toFixed(2)};
