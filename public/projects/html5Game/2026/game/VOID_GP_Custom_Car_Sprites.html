<title>VOID GP – Pixel Space Racer</title>
<style>

<script>
(()=>{
// ---------- any phone: world is 402 px wide (height follows the screen), HUD at half that resolution ----------
const SW=402,SHALF=SW/2,W=201,HALF=W/2;
let CARK=1,SH=874,H=437,HZ=330,PY=700,OY=0,dyT=-22,dyB=10,dyC=-11; // recomputed by layout() for every screen
const SEG=200,ROADW=710,CAMH=1000,DEPTH=1/Math.tan(50*Math.PI/180),DRAW=240,CENTRI=0.5,LAPS=5;
let playerZ=CAMH*DEPTH*SHALF/(PY-HZ),scaleP=DEPTH/playerZ;
const MAX=SEG*60,ACC=MAX/4.5;
const PAL=[0xff24302e,0xff566c6a,0xff80a0a0,0xffb4d4d6]; // GB-style olive LCD: dark, mid, light, paper
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const cv=document.getElementById('c');let g=cv.getContext('2d');
function layer(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h);return{c,x,im,pix:new Uint32Array(im.data.buffer),w,h}}
let SCN,HUD,GRID,BT={};
// fit any phone: world stays 402 px wide, height follows the screen's aspect (clamped 1.5-2.7, letterboxed beyond)
function layout(){
  const box=document.body,vw=box.clientWidth||innerWidth,vh=box.clientHeight||innerHeight,dpr=Math.min(3,window.devicePixelRatio||1);
  const asp=clamp(vh/vw,1.5,2.7),cssW=vh/vw>asp?vw:vh/asp,cssH=cssW*asp;
  SH=Math.round(SW*asp/2)*2;H=SH/2;dyT=-22;dyB=H-437+10;dyC=Math.round((H-437)/2)-11;
  PY=SH-154;HZ=PY-Math.min(370,PY-160);playerZ=CAMH*DEPTH*SHALF/(PY-HZ);scaleP=DEPTH/playerZ;
  CARK=(2*ROADW*scaleP*SHALF/3)/CARS[0][1].w; // straight-on car exactly one lane wide at the player's row
  cv.style.width=Math.round(cssW)+'px';cv.style.height=Math.round(cssH)+'px';
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  SCN=layer(SW,SH);HUD=layer(W,H);
  // LCD grid: one thin line on the right/bottom edge of every world pixel, aligned to the real device pixels
  GRID=document.createElement('canvas');GRID.width=cv.width;GRID.height=cv.height;const gx=GRID.getContext('2d'),sx=cv.width/SW,sy=cv.height/SH,lw=Math.max(1,Math.round(sx/3));
  gx.fillStyle='rgba(20,24,14,.22)';for(let i=1;i<=SW;i++)gx.fillRect(Math.round(i*sx)-lw,0,lw,cv.height);for(let j=1;j<=SH;j++)gx.fillRect(0,Math.round(j*sy)-lw,cv.width,lw);
  BT={tilt:[HALF-62,180+dyC,124,22],touch:[HALF-62,208+dyC,124,22],snd:[HALF-40,240+dyC,80,16],again:[HALF-56,234+dyC,112,22],menu:[HALF-56,260+dyC,112,22],mute:[HALF-9,57+dyT,18,11],rec:[W-37,391+dyB,26,26]}}
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layout,120)});

let tp,tw,th;const target=L=>{tp=L.pix;tw=L.w;th=L.h};

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const bay=(x,y)=>BAY[((y&3)<<2)|(x&3)];
const toneOf=(v,x,y)=>{const t=clamp(v,0,1)*3,lo=Math.floor(t);return Math.min(3,lo+(bay(x,y)<t-lo?1:0))};
const hash=(a,b)=>{let h=Math.imul(a|0,374761393)+Math.imul(b|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};

function px(x,y,c){x=Math.round(x);y=Math.round(y)+OY;if(c<0||x<0||y<0||x>=tw||y>=th)return;tp[y*tw+x]=PAL[c]}
function row(x0,x1,y,c){y=Math.round(y)+OY;if(y<0||y>=th)return;x0=Math.max(0,Math.round(x0));x1=Math.min(tw,Math.round(x1));const o=y*tw,v=PAL[c];for(let x=x0;x<x1;x++)tp[o+x]=v}
function rowL(x0,x1,y,lo,hi,lv){y=Math.round(y)+OY;if(y<0||y>=th)return;x0=Math.max(0,Math.round(x0));x1=Math.min(tw,Math.round(x1));const o=y*tw;for(let x=x0;x<x1;x++)tp[o+x]=PAL[bay(x,y)<lv?hi:lo]}
function rect(x,y,w,h,c,clip=1e9){x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);for(let j=0;j<h;j++){if(y+j>=clip)break;row(x,x+w,y+j,c)}}
function frame_(x,y,w,h,fill,line){rect(x,y,w,h,fill);row(x+1,x+w-1,y,line);row(x+1,x+w-1,y+h-1,line);for(let j=1;j<h-1;j++){px(x,y+j,line);px(x+w-1,y+j,line)}}
function disc(cx,cy,r,c){for(let dy=-r;dy<=r;dy++){const s=Math.floor(Math.sqrt(r*r-dy*dy)+.3);row(cx-s,cx+s+1,cy+dy,c)}}
function ring(cx,cy,r,c){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const d=dx*dx+dy*dy;if(d<=r*r+r*.6&&d>(r-1)*(r-1)+r*.6)px(cx+dx,cy+dy,c)}}

'/':'001001010100100',':':'000010000010000','.':'000000000000010','-':'000000111000000','!':'010010010000010','+':'000010111010000',' ':'000000000000000'};
function text(s,x,y,sc,c,al='l',sh=0){const w=s.length*4*sc-sc;if(al==='c')x=Math.round(x-w/2);else if(al==='r')x-=w;
  if(sh)text(s,x+sc,y+sc,sc,0,'l',0);
  for(let i=0;i<s.length;i++){const gph=F[s[i]]||F[' '];for(let r=0;r<5;r++)for(let q=0;q<3;q++)if(gph[r*3+q]==='1')rect(x+i*4*sc+q*sc,y+r*sc,sc,sc,c)}}

// ---------- sprites ----------
function outline(d,w,h){const o=d.slice();for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[y*w+x]>=0)continue;
  if((x>0&&d[y*w+x-1]>=0)||(x<w-1&&d[y*w+x+1]>=0)||(y>0&&d[(y-1)*w+x]>=0)||(y<h-1&&d[(y+1)*w+x]>=0))o[y*w+x]=0}return o}
